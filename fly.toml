# fly.toml app configuration file generated for silentwolf on 2026-06-05T09:57:25Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'silentwolf'
primary_region = 'ams'
kill_signal = 'SIGINT'
kill_timeout = '30s'

[build]

[env]
  BOT_MODE = 'public'
  BOT_NAME = 'WOLFBOT'
  BOT_PREFIX = '.'
  BOT_TIMEZONE = 'UTC'
  NODE_ENV = 'production'
  OWNER_NUMBER = ''
  PAYSTACK_KEY = ''
  PORT = '3000'
  PTERODACTYL_KEY = ''
  PTERODACTYL_URL = ''

[[mounts]]
  source = 'wolfbot_data'
  destination = '/app/data'
  initial_size = '1gb'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1gb'
  auto_extend_size_limit = '10gb'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
